name: Validate Factures branch
# Re-run CI after adding the missing httpx fixture dependency for vehicle weighing.
concurrency:
  group: commercial-foundation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/factures-2026-10-27
      - feature/commercial-foundation
      - feature/commercial-audit
      - feature/comptabilite
      - audit/erp-foundation
      - feature/vehicle-weighing-foundation
      - erp/treasury-movement-preview-phase-10
      - erp/treasury-explicit-movement-recording-phase-11
      - erp/treasury-movement-register-phase-12
      - erp/bank-statement-preview-phase-13
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify GitHub-hosted runner execution
        run: |
          echo "GitHub-hosted runner started"
          python --version

  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q backend

  invoice-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: unit-test-only-secret
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: invoices_unit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: python -m pip install fastapi python-multipart pymongo motor python-dotenv pyjwt passlib httpx pytest pytest-asyncio pytest-xdist
      - name: Test invoice calculations and accounting foundation
        run: >-
          python -m pytest -o addopts=
          tests/test_workforce_attendance.py
          tests/test_invoices_unit.py
          tests/test_client_accounts_unit.py
          tests/test_tunisie_sms_phone_unit.py
          tests/test_client_delete_unit.py
          tests/test_load_delete_unit.py
          tests/test_load_completion_reliability.py
          tests/test_atomic_invoice_deletes_unit.py
          tests/test_client_options_unit.py
          tests/test_required_idempotency_indexes.py
          tests/test_accounting_foundation.py
          tests/test_gs_sales_treasury_allocation.py
          tests/test_gs_supplier_payment_treasury_allocation.py
          tests/test_treasury_accounts.py
          tests/test_treasury_movement_preview.py
          tests/test_treasury_movement_recording.py
          tests/test_treasury_register.py
          tests/test_bank_statement_preview.py

  vehicle-weighing-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: unit-test-only-secret
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: vehicle_weighing_unit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install weighing test dependencies
        run: python -m pip install "pydantic>=2" fastapi pymongo motor python-dotenv pyjwt passlib httpx pytest pytest-asyncio pytest-xdist
      - name: Validate exact gross, tare, and net weighing contract
        run: python -m pytest -o addopts= tests/test_weighing.py tests/test_scale_config.py tests/test_load_intake_idempotency.py

  weighbridge-agent-core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/weighbridge-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local weighbridge agent core
        run: python -m pip install -e ".[test]"
      - name: Test protocol registry, sample validation, unit conversion, and stability gate
        run: python -m pytest -o addopts= tests

  commercial-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: unit-test-only-secret
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: commercial_unit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install commercial domain test dependencies
        run: python -m pip install "pydantic>=2" pymongo motor fastapi python-multipart python-dotenv pyjwt passlib httpx pytest pytest-asyncio pytest-xdist
      - name: Test commercial schemas, bootstrap, permissions, and reference validation
        run: python -m pytest -o addopts= commercial/tests --ignore=commercial/tests/test_mongodb_transaction_integration.py --ignore=commercial/tests/test_mongodb_production_integration.py --ignore=commercial/tests/test_mongodb_quality_separation.py --ignore=commercial/tests/test_mongodb_customer_custody_integration.py --ignore=commercial/tests/test_mongodb_credit_application_integration.py --ignore=commercial/tests/test_mongodb_payment_reversal_integration.py --ignore=commercial/tests/test_payment_reversal_concurrency_integration.py --ignore=commercial/tests/test_mongodb_return_rejection_integration.py

  mongodb-transaction-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0
      DB_NAME: commercial_integration_test
      JWT_SECRET: integration-test-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install transaction integration dependencies
        run: python -m pip install "pydantic>=2" pymongo motor fastapi python-multipart python-dotenv pyjwt passlib pytest pytest-asyncio pytest-xdist
      - name: Start MongoDB replica-set container
        run: docker run -d --name mongo-rs -p 27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all
      - name: Initialize MongoDB replica set
        run: |
          python - <<'PY'
          import time
          from pymongo import MongoClient

          direct = MongoClient(
              "mongodb://127.0.0.1:27017/?directConnection=true",
              serverSelectionTimeoutMS=2000,
          )
          for _ in range(30):
              try:
                  direct.admin.command("ping")
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError("MongoDB did not become available")

          try:
              direct.admin.command(
                  "replSetInitiate",
                  {"_id": "rs0", "members": [{"_id": 0, "host": "127.0.0.1:27017"}]},
              )
          except Exception as exc:
              if "already initialized" not in str(exc).lower():
                  raise
          direct.close()

          replica = MongoClient(
              "mongodb://127.0.0.1:27017/?replicaSet=rs0",
              serverSelectionTimeoutMS=2000,
          )
          for _ in range(30):
              try:
                  if replica.admin.command("hello").get("isWritablePrimary"):
                      break
              except Exception:
                  pass
              time.sleep(1)
          else:
              raise RuntimeError("MongoDB replica set did not elect a primary")
          replica.close()
          PY
      - name: Verify commercial transaction and custody/accounting invariants on a real replica set
        run: |
          python -m pytest -o addopts= \
            commercial/tests/test_mongodb_transaction_integration.py \
            commercial/tests/test_mongodb_production_integration.py \
            commercial/tests/test_mongodb_quality_separation.py \
            commercial/tests/test_mongodb_customer_custody_integration.py \
            commercial/tests/test_mongodb_credit_application_integration.py \
            commercial/tests/test_mongodb_payment_reversal_integration.py \
            commercial/tests/test_payment_reversal_concurrency_integration.py \
            commercial/tests/test_mongodb_return_rejection_integration.py \
            tests/test_workforce_attendance_integration.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Build frontend
        working-directory: frontend
        run: npm run build
