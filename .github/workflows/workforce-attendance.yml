name: Workforce attendance regression checks

on:
  pull_request:
    paths:
      - "backend/routers/workforce.py"
      - "backend/tests/test_workforce_attendance.py"
      - "frontend/src/pages/Workforce.tsx"
      - ".github/workflows/workforce-attendance.yml"
  push:
    branches:
      - main
    paths:
      - "backend/routers/workforce.py"
      - "backend/tests/test_workforce_attendance.py"
      - "frontend/src/pages/Workforce.tsx"
      - ".github/workflows/workforce-attendance.yml"

jobs:
  workforce-attendance-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner and conftest dependencies
        run: python -m pip install pytest pytest-xdist httpx pytest-asyncio
      - name: Run workforce attendance regression checks
        run: python -m pytest -o addopts= tests/test_workforce_attendance.py -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  workforce-integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0
      DB_NAME: workforce_integration_test
      JWT_SECRET: workforce-integration-test-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install integration test dependencies
        run: python -m pip install "pydantic>=2" fastapi python-multipart pymongo motor python-dotenv pyjwt passlib httpx pytest pytest-asyncio
      - name: Start MongoDB replica set
        run: docker run -d --name workforce-mongo -p 27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all
      - name: Initialize MongoDB replica set
        run: |
          python - <<'PY'
          import time
          from pymongo import MongoClient
          direct = MongoClient("mongodb://127.0.0.1:27017/?directConnection=true", serverSelectionTimeoutMS=2000)
          for _ in range(30):
              try:
                  direct.admin.command("ping")
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError("MongoDB did not start")
          try:
              direct.admin.command("replSetInitiate", {"_id": "rs0", "members": [{"_id": 0, "host": "127.0.0.1:27017"}]})
          except Exception as exc:
              if "already initialized" not in str(exc).lower():
                  raise
          replica = MongoClient("mongodb://127.0.0.1:27017/?replicaSet=rs0", serverSelectionTimeoutMS=2000)
          for _ in range(30):
              try:
                  if replica.admin.command("hello").get("isWritablePrimary"):
                      break
              except Exception:
                  pass
              time.sleep(1)
          else:
              raise RuntimeError("MongoDB replica set did not elect a primary")
          direct.close()
          replica.close()
          PY
      - name: Test workforce employee registry and attendance lifecycle against MongoDB
        run: python -m pytest -o addopts= tests/test_workforce_attendance_integration.py -q
