name: Workforce attendance regression checks

on:
  pull_request:
    paths:
      - "backend/routers/workforce.py"
      - "backend/tests/test_workforce_attendance.py"
      - "frontend/src/pages/Workforce.tsx"
      - ".github/workflows/workforce-attendance.yml"
  push:
    branches:
      - main
    paths:
      - "backend/routers/workforce.py"
      - "backend/tests/test_workforce_attendance.py"
      - "frontend/src/pages/Workforce.tsx"
      - ".github/workflows/workforce-attendance.yml"

jobs:
  workforce-attendance-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner and conftest dependencies
        run: python -m pip install pytest pytest-xdist httpx pytest-asyncio
      - name: Run workforce attendance regression checks
        run: python -m pytest -o addopts= tests/test_workforce_attendance.py -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Build frontend
        working-directory: frontend
        run: npm run build
