name: Accounting foundation tests

on:
  pull_request:
    paths:
      - "backend/accounting_foundation/**"
      - "backend/tests/test_accounting_foundation.py"
      - "backend/tests/test_traditional_accounting_adapter.py"
      - "backend/tests/test_commercial_accounting_adapter.py"
      - "backend/tests/test_accounting_reconciliation_preview.py"
      - "backend/tests/test_traditional_treasury.py"
      - "backend/tests/test_treasury_register.py"
      - "backend/tests/test_treasury_movement_recording.py"
      - "backend/tests/test_treasury_accounts.py"
      - ".github/workflows/accounting-foundation.yml"
  push:
    branches:
      - main
      - erp/foundation-phase-1
      - erp/traditional-financial-adapter-phase-2
      - erp/gs-supplier-financial-adapter-phase-3
      - erp/accounting-reconciliation-preview-phase-4
    paths:
      - "backend/accounting_foundation/**"
      - "backend/tests/test_accounting_foundation.py"
      - "backend/tests/test_traditional_accounting_adapter.py"
      - "backend/tests/test_commercial_accounting_adapter.py"
      - "backend/tests/test_accounting_reconciliation_preview.py"
      - ".github/workflows/accounting-foundation.yml"

jobs:
  accounting-foundation-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install pytest pytest-xdist httpx pytest-asyncio
      - name: Run accounting foundation and source adapter tests
        run: >-
          python -m pytest
          tests/test_accounting_foundation.py
          tests/test_traditional_accounting_adapter.py
          tests/test_commercial_accounting_adapter.py
          tests/test_accounting_reconciliation_preview.py
          tests/test_traditional_treasury.py
          tests/test_treasury_register.py
          tests/test_treasury_movement_recording.py
          tests/test_treasury_accounts.py
          -q
