name: Accounting foundation tests

on:
  pull_request:
    paths:
      - "backend/accounting_foundation/**"
      - "backend/tests/test_accounting_foundation.py"
      - ".github/workflows/accounting-foundation.yml"
  push:
    branches:
      - main
      - erp/foundation-phase-1
    paths:
      - "backend/accounting_foundation/**"
      - "backend/tests/test_accounting_foundation.py"
      - ".github/workflows/accounting-foundation.yml"

jobs:
  accounting-foundation-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install pytest pytest-xdist httpx pytest-asyncio
      - name: Run deterministic accounting foundation tests
        run: python -m pytest tests/test_accounting_foundation.py -q
